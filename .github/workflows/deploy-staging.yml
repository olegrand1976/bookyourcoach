name: 🧪 Déploiement staging (Cloud Run)

# Push sur la branche `staging` → images Cloud Run (mêmes Dockerfiles que infra/gcp/cloudbuild.yaml)
# puis mise à jour des services bookyourcoach-*-staging. Seule l'image change : la configuration
# des services (variables, secrets, Cloud SQL, VPC) posée par cloudbuild.yaml est conservée.
on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GCP_PROJECT: premedica-prod-2025
  GCP_REGION: europe-west9
  AR_HOST: europe-west1-docker.pkg.dev
  AR_REPO: europe-west1-docker.pkg.dev/premedica-prod-2025/bookyourcoach
  API_SERVICE: bookyourcoach-api-staging
  WEB_SERVICE: bookyourcoach-web-staging
  API_PUBLIC_URL: https://api-bookyourcoach.ll-it-sc.be
  WEB_PUBLIC_URL: https://bookyourcoach.ll-it-sc.be

jobs:
  deploy:
    name: 🏗️ Build + 🚀 Deploy staging
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: 🔑 Auth GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY_BYC }}

    - name: ⚙️ Setup gcloud
      uses: google-github-actions/setup-gcloud@v2

    - name: 🔍 Services staging existants
      # Un `gcloud run deploy --image` sur un service absent en créerait un sans secrets ni Cloud SQL.
      run: |
        for svc in "$API_SERVICE" "$WEB_SERVICE"; do
          gcloud run services describe "$svc" --region="$GCP_REGION" --project="$GCP_PROJECT" \
            --format='value(metadata.name)' >/dev/null \
            || { echo "::error::Service $svc introuvable : initialiser avec gcloud builds submit --config=infra/gcp/cloudbuild.yaml"; exit 1; }
        done

    - name: 🐳 Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🔐 Configure Docker → Artifact Registry
      run: gcloud auth configure-docker ${{ env.AR_HOST }} --quiet

    - name: 🏗️ Build + push API
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.cloudrun.api
        platforms: linux/amd64
        push: true
        tags: ${{ env.AR_REPO }}/api:staging-${{ github.sha }}
        cache-from: type=gha,scope=byc-staging-api
        cache-to: type=gha,mode=max,scope=byc-staging-api

    - name: 🎨 Build + push Web
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile.cloudrun.web
        platforms: linux/amd64
        push: true
        tags: ${{ env.AR_REPO }}/web:staging-${{ github.sha }}
        build-args: |
          API_PUBLIC_URL=${{ env.API_PUBLIC_URL }}
          WEB_PUBLIC_URL=${{ env.WEB_PUBLIC_URL }}
        cache-from: type=gha,scope=byc-staging-web
        cache-to: type=gha,mode=max,scope=byc-staging-web

    - name: 🚀 Deploy API
      run: |
        gcloud run deploy "$API_SERVICE" \
          --image="$AR_REPO/api:staging-${{ github.sha }}" \
          --region="$GCP_REGION" --project="$GCP_PROJECT" --quiet

    - name: 🎨 Deploy Web
      run: |
        gcloud run deploy "$WEB_SERVICE" \
          --image="$AR_REPO/web:staging-${{ github.sha }}" \
          --region="$GCP_REGION" --project="$GCP_PROJECT" --quiet

    - name: ✅ Contrôle post-déploiement
      run: |
        set -euo pipefail
        for svc in "$API_SERVICE" "$WEB_SERVICE"; do
          img=$(gcloud run services describe "$svc" --region="$GCP_REGION" --project="$GCP_PROJECT" \
            --format='value(spec.template.spec.containers[0].image)')
          ready=$(gcloud run services describe "$svc" --region="$GCP_REGION" --project="$GCP_PROJECT" \
            --format='value(status.conditions[0].status)')
          echo "$svc → $img (Ready=$ready)"
          [[ "$img" == *"staging-${{ github.sha }}" && "$ready" == "True" ]] || { echo "::error::$svc non à jour"; exit 1; }
        done
        # Front servi et API qui répond (401 attendu sans session sur une route club)
        for i in 1 2 3 4 5; do
          web=$(curl -s -o /dev/null -w '%{http_code}' "$WEB_PUBLIC_URL/login" || true)
          api=$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: application/json' "$API_PUBLIC_URL/api/club/subscriptions/expiring" || true)
          echo "web /login=$web · api /club/subscriptions/expiring=$api"
          [[ "$web" == "200" && "$api" == "401" ]] && exit 0
          sleep 15
        done
        echo "::error::Staging ne répond pas comme attendu"; exit 1
