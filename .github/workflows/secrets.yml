name: Détection de secrets

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Un identifiant réel s'est retrouvé dans les tests end-to-end d'un dépôt public et
# y est resté quatorze mois. Ce garde-fou vise les diffs : il empêche la prochaine
# fuite, il ne nettoie pas l'historique.
jobs:
  gitleaks:
    name: gitleaks sur les modifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Les deux révisions comparées doivent être présentes localement.
          fetch-depth: 0

      - name: Analyser les commits de la référence
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Sur une pull request, l'action limite d'elle-même l'analyse aux commits
          # de la branche ; sur push, elle analyse les commits poussés.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true
