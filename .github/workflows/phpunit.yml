name: PHPUnit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  phpunit:
    name: Suite PHPUnit complète
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, fileinfo, json, tokenizer, pdo, pdo_sqlite, sqlite3
          coverage: none
          # La suite complète dépasse la limite par défaut (128 Mo) autour du 550e test.
          ini-values: memory_limit=1G

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare SQLite test database
        run: mkdir -p database && touch database/testing.sqlite

      # Jusqu'ici la CI n'exécutait que `composer test:recurring`, soit 4 fichiers sur près de
      # cent : des régressions sont passées au merge sans être vues. On exécute la suite entière.
      - name: Run test suite
        run: php -d memory_limit=1G vendor/bin/phpunit
